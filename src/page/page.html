<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Listless</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>{{STYLE}}</style>
</head>
<body>
<header class="bar" hidden>
	<div class="bar-inner">
		<div class="heading">
			<h1 id="title"></h1>
			<p id="progress-text" aria-live="polite"></p>
		</div>
		<div class="actions" role="toolbar" aria-label="List actions">
			<button type="button" id="copy" class="icon" aria-label="Copy as Markdown" title="Copy as Markdown">
				<svg viewBox="0 0 24 24" aria-hidden="true"><g class="when-idle"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></g><path class="when-flash" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
			</button>
			<button type="button" id="share" class="icon" aria-label="Copy share link" title="Copy share link">
				<svg viewBox="0 0 24 24" aria-hidden="true"><g class="when-idle"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g><path class="when-flash" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
			</button>
			<button type="button" id="toggle-done" class="icon" aria-pressed="false">
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.25l2.5 2.5 4.5-5"/><path class="slash-gap" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg>
			</button>
			<button type="button" id="toggle-upcoming" class="icon" aria-pressed="false" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/><path class="slash-gap" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg>
			</button>
			<div class="menu" id="display-menu" hidden>
				<button type="button" id="display" class="icon" aria-label="Display options" title="Display options" aria-haspopup="true" aria-expanded="false" aria-controls="display-pill">
					<svg viewBox="0 0 24 24" aria-hidden="true"><g class="lines"><path d="M4 5h16M4 9.5h10"/></g><g class="drawer-icon"><rect x="7" y="14" width="13" height="6" rx="2"/></g></svg>
				</button>
				<div class="pill" id="display-pill" role="group" aria-label="Display options">
					<button type="button" id="toggle-details" class="icon" aria-pressed="false">
						<svg viewBox="0 0 24 24" aria-hidden="true"><g class="lines"><path d="M4 8h16M4 13h10"/></g></svg>
					</button>
					<button type="button" id="toggle-copy" class="icon" aria-pressed="false">
						<svg viewBox="0 0 24 24" aria-hidden="true"><g class="drawer-icon"><rect x="5" y="8" width="14" height="8" rx="2"/></g></svg>
					</button>
				</div>
			</div>
			<button type="button" id="reset" class="icon" aria-label="Uncheck all" title="Uncheck all">
				<svg viewBox="0 0 24 24" aria-hidden="true"><g class="when-idle"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/></g><path class="when-armed" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
			</button>
			<button type="button" id="delete" class="icon danger" aria-label="Delete list" title="Delete list">
				<svg viewBox="0 0 24 24" aria-hidden="true"><g class="when-idle"><path d="M4 7h16M10 11v6M14 11v6M9 7V4.5h6V7"/><path d="M6 7l.9 12.1A1.5 1.5 0 0 0 8.4 20.5h7.2a1.5 1.5 0 0 0 1.5-1.4L18 7"/></g><path class="when-armed" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
			</button>
		</div>
	</div>
	<div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
</header>

<main>
	<p id="description" class="description" hidden></p>
	<p id="notice" class="notice" hidden></p>
	<p id="announce" class="visually-hidden" aria-live="polite"></p>
	<div id="list" hidden></div>
	<button type="button" id="upcoming-hidden" class="upcoming-hidden" hidden></button>
	<div id="all-done" class="all-done" hidden>
		<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22"/><path d="M14.5 24.5l6.5 6.5 13-14"/></svg>
		<p><strong>All done.</strong> Every task is checked off.</p>
	</div>
	<section id="index" class="index" hidden>
		<h1>Lists in this browser</h1>
		<ul id="index-list"></ul>
	</section>
	<section id="message" class="message" hidden>
		<h1 id="message-title"></h1>
		<p id="message-body"></p>
		<button type="button" id="message-action" hidden></button>
	</section>
</main>

<footer>
	<p>Stored only in this browser. Nothing on this page is sent anywhere. <a href="/l/">Your lists</a> · <a href="/">How Listless works</a></p>
</footer>

<div id="toast" class="toast" role="status" hidden>
	<span id="toast-text"></span>
	<button type="button" id="toast-undo">Undo</button>
</div>

<script>{{SCRIPT}}</script>
</body>
</html>
