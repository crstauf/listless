name: Check

# Runs on pull requests, and is reused by the deploy workflow. It has no
# access to secrets and can't deploy.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Rebuild the page and confirm the committed copy matches
        run: |
          npm run build
          git diff --exit-code -- src/page.generated.ts

      - run: npm run typecheck

      - run: npm test

      - name: Test the page in a browser
        run: |
          npx playwright install chromium
          npm run test:page
